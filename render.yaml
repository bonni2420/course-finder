services:
  - type: web
    name: course-finder
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn course_finder.wsgi:application --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: course-finder-db
          property: connectionString

databases:
  - name: course-finder-db
    plan: free
